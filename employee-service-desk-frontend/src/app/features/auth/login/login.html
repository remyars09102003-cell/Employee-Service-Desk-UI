```html
<div class="login-page">

  <div class="login-card">

    <!-- Application logo -->
    <div class="brand-section">
      <div class="brand-icon">ES</div>

      <h2>Employee Service Desk</h2>

      <p>Sign in to your account</p>
    </div>

    <!-- Login form -->
    <form
      #loginForm="ngForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >

      <!-- Email -->
      <div class="mb-3">

        <label for="email" class="form-label">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          placeholder="Enter your email address"
          autocomplete="username"
          required
        />

      </div>

      <!-- Password -->
      <div class="mb-3">

        <label for="password" class="form-label">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />

      </div>

      <!-- Forgot password -->
      <div class="forgot-password">
        <a routerLink="/forgot-password">
          Forgot password?
        </a>
      </div>

      <!-- Error message -->
      <div
        *ngIf="errorMessage"
        class="alert alert-danger"
        role="alert"
      >
        {{ errorMessage }}
      </div>

      <!-- Success message -->
      <div
        *ngIf="successMessage"
        class="alert alert-success"
        role="status"
      >
        {{ successMessage }}
      </div>

      <!-- Sign In button -->
      <button
        type="submit"
        class="btn btn-primary login-button"
        [disabled]="loading"
      >
        <span *ngIf="!loading">
          Sign In
        </span>

        <span *ngIf="loading">
          Signing in...
        </span>
      </button>

    </form>

    <!-- Register link -->
    <div class="register-section">
      <span>Don't have an account?</span>

      <a routerLink="/register">
        Create an account
      </a>
    </div>

  </div>

</div>
```
